.score{color:#00ff88;font-weight:900}
.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.odd{background:#0a0e1a;border:1px solid #333;padding:10px;border-radius:10px;text-align:center}
.odd b{color:#00ff88;display:block;font-size:18px}
.btn{width:100%;background:#00ff88;color:#000;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px;font-size:16px}
.btn-red{background:red;color:#fff}
.stake{display:flex;gap:8px;margin:10px 0}

<div style="padding:15px">

<p style="text-align:center;color:#666;font-size:10px;margin-top:10px">18+ | Real Time Gaming | Bet Mtaani Best Gamblers</p>
</div>

<script>
let mult=1.00, flying=true, betActive=false, myStake=50, cashed=false;
let planePos=20;
let interval=setInterval(gameLoop,100);

function gameLoop(){
if(!flying) return;
mult+=0.01 + Math.random()*0.05;
planePos+=1.5;
document.getElementById('mult').innerText=mult.toFixed(2)+'x';
document.getElementById('plane').style.left=planePos+'px';
document.getElementById('plane').style.bottom=(30+planePos*0.6)+'px';
if(Math.random()<0.008 && mult>1.5){ crash(); }
}

function crash(){
flying=false;
document.getElementById('mult').classList.add('crashed');
document.getElementById('status').innerText='💥 IMECRASH '+mult.toFixed(2)+'x!';
document.getElementById('status').style.color='red';
document.getElementById('plane').innerText='💥';
setTimeout(resetGame,3000);
if(betActive && !cashed){ document.getElementById('status').innerText+=' - UMECHOMEKA!'; betActive=false; }
}

function resetGame(){
mult=1.00; planePos=20; flying=true;
document.getElementById('mult').classList.remove('crashed');
document.getElementById('mult').innerText='1.00x';
document.getElementById('plane').style.left='20px';
document.getElementById('plane').style.bottom='30px';
document.getElementById('plane').innerText='✈️';
document.getElementById('status').innerText='Inapaa... Weka BET!';
document.getElementById('status').style.color='#00ff88';
if(betActive) document.getElementById('cashBtn').style.display='block';
}

function placeBet(){
myStake=document.getElementById('stake').value;
betActive=true; cashed=false;
document.getElementById('betBtn').style.display='none';
document.getElementById('cashBtn').style.display='block';
document.getElementById('cashBtn').innerText='CASHOUT KES '+(myStake*mult).toFixed(0);
document.getElementById('status').innerText='BET ACTIVE KES '+myStake+' - Ngoja CASHOUT!';
setInterval(()=>{
if(betActive && !cashed) document.getElementById('cashBtn').innerText='CASHOUT KES '+(myStake*mult).toFixed(0);
},100);
}

function cashout(){
if(!betActive || cashed) return;
cashed=true;
let win=(myStake*mult).toFixed(0);
alert('🔥 UMEWIN KES '+win+' kwa multiplier '+mult.toFixed(2)+'x! Tuma screenshot kwa WhatsApp 0751768763');
betActive=false;
document.getElementById('betBtn').style.display='block';
document.getElementById('cashBtn').style.display='none';
}

// Live scores changing real time
setInterval(()=>{
let s1=document.getElementById('score1');
if(s1) s1.innerText=Math.floor(Math.random()*3)+' - '+Math.floor(Math.random()*3);
document.getElementById('o1').innerText=(1.5+Math.random()).toFixed(2);
document.getElementById('o2').innerText=(2+Math.random()).toFixed(2);
document.getElementById('o3').innerText=(2.5+Math.random()).toFixed(2);
},2000);

function tab(t){
document.getElementById('aviatorBox').style.display=t=='aviator'?'block':'none';
document.getElementById('liveBox').style.display=t=='live'?'block':'none';
}
</script>
